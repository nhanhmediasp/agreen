# ============================================================
# AGREEN CAR RENTAL — cấu hình nginx cho aaPanel
#
# Cách dùng: aaPanel > Website > (tên site) > Config > dán nội dung dưới đây,
# thay yourdomain.com và đường dẫn root cho khớp máy bạn.
#
# Điểm quan trọng: `add_header` trong nginx KHÔNG kế thừa xuống location con.
# Bản cũ khai báo security header ở cấp server nhưng location /assets/ lại có
# add_header riêng, nên toàn bộ /assets/ mất sạch header bảo mật.
# Ở đây dùng include chung để mọi location đều có đủ header.
# ============================================================

# --- Chuyển hết HTTP sang HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Cho phép Let's Encrypt xác thực trước khi redirect
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yourdomain.com www.yourdomain.com;

    # --- SSL (aaPanel tự chèn khi bạn bật Let's Encrypt trong panel) ---
    ssl_certificate     /www/server/panel/vhost/cert/yourdomain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Thư mục build của Vite
    root /www/wwwroot/car-rental-dashboard/dist;
    index index.html;

    # Giới hạn kích thước upload — phải >= MAX_UPLOAD_MB trong .env
    client_max_body_size 12M;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # --- SPA: mọi route của React Router đều trả index.html ---
    location / {
        include /www/wwwroot/car-rental-dashboard/nginx-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # --- API Node.js ---
    location /api/ {
        include /www/wwwroot/car-rental-dashboard/nginx-security-headers.conf;
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Không cache API
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # --- Tệp người dùng upload (ảnh xe, PDF hợp đồng) ---
    location /uploads/ {
        include /www/wwwroot/car-rental-dashboard/nginx-security-headers.conf;
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        # Không cho trình duyệt thực thi nội dung tệp do người dùng tải lên
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; object-src 'none'; sandbox" always;
    }

    # --- Asset build có hash trong tên -> cache vĩnh viễn ---
    location /assets/ {
        include /www/wwwroot/car-rental-dashboard/nginx-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
        access_log off;
    }

    # --- Ảnh/font tĩnh khác ---
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /www/wwwroot/car-rental-dashboard/nginx-security-headers.conf;
        expires 6M;
        add_header Cache-Control "public, max-age=15552000, immutable" always;
        access_log off;
    }

    # --- Chặn tệp ẩn (.env, .git, ...) ---
    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 404 /index.html;
}
