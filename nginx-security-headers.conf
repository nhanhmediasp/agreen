# ============================================================
# Security header dùng chung cho MỌI location.
#
# Lý do tách file: trong nginx, `add_header` khai báo ở cấp server sẽ bị
# HUỶ BỎ trong bất kỳ location nào có add_header riêng. Bản cấu hình trước
# vì thế để lộ /assets/ và các tệp tĩnh không có một header bảo mật nào.
#
# `include` file này trong từng location là cách chắc chắn nhất.
# ============================================================

add_header X-Frame-Options        "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

# HSTS — chỉ bật SAU khi HTTPS đã chạy ổn định, vì trình duyệt sẽ ghi nhớ
# và từ chối truy cập qua HTTP trong suốt thời gian max-age.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# X-XSS-Protection đã bị mọi trình duyệt hiện đại loại bỏ (Chrome bỏ từ v78)
# và từng gây lỗ hổng riêng, nên không khai báo nữa. CSP bên dưới thay thế.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
